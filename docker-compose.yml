services:
  mysql:
    image: mysql:8.4.10
    container_name: proyecto3-mysql
    environment:
      MYSQL_ROOT_PASSWORD: proyecto3_root
      MYSQL_USER: proyecto3
      MYSQL_PASSWORD: proyecto3_local
      MYSQL_DATABASE: proyecto3_control
    command:
      - --sql-mode=ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pproyecto3_root"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - proyecto3_mysql:/var/lib/mysql

volumes:
  proyecto3_mysql:
